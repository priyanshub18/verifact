[project]
name = "verifact-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "httpx>=0.27", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "aiosqlite>=0.20",
  "arq>=0.26", "redis>=5", "trafilatura>=1.12", "rank-bm25>=0.2.2", "anthropic>=0.40",
  "openai>=1.50", "tldextract>=5.1", "structlog>=24.4", "python-multipart>=0.0.9",
  "sse-starlette>=2.1", "langdetect>=1.0.9", "ddgs>=9.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real external services; requires API keys"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
