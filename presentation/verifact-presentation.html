<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VeriFact: Multimodal Fake Information Detector (18-Slide Presentation)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #14213d;
        --ink: #1f2937;
        --muted: #5b6475;
        --dim: #8a92a3;
        --line: #dfe3ea;
        --soft: #f5f7fa;
        --accent: #9b1c2c;
        --accent-soft: #fbeef0;
        --blue: #1d4e89;
        --blue-soft: #eaf1fa;
        --green: #1e7a4f;
        --green-soft: #e9f6ef;
        --gold: #b7791f;
        --gold-soft: #fbf4e6;
        --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
        --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e8ebf0;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
      }

      /* ---------- chrome ---------- */
      #viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1280px;
        height: 720px;
        transform-origin: center;
        background: #fff;
        box-shadow: 0 12px 40px rgba(20, 33, 61, 0.16);
        overflow: hidden;
      }
      footer {
        flex: none;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        background: #fff;
        border-top: 1px solid var(--line);
      }
      .btn {
        height: 34px;
        min-width: 36px;
        padding: 0 12px;
        border: 1px solid #cdd3dd;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: var(--navy);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        border-color: var(--navy);
        background: var(--soft);
      }
      .btn.on {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      #prog {
        flex: 1;
        display: flex;
        gap: 3px;
        align-items: center;
      }
      #prog .seg {
        flex: var(--n);
        height: 6px;
        border-radius: 3px;
        background: #e3e7ee;
        overflow: hidden;
        cursor: pointer;
      }
      #prog .seg i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--navy);
        transition: width 0.3s;
      }
      #count {
        font-size: 14px;
        color: var(--muted);
        min-width: 64px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #notes {
        position: fixed;
        left: 20px;
        bottom: 68px;
        width: min(580px, calc(100vw - 40px));
        background: #fff;
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink);
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18);
        z-index: 20;
      }
      #notes small {
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 4px;
      }
      #menu {
        position: fixed;
        right: 20px;
        bottom: 68px;
        width: min(420px, calc(100vw - 40px));
        max-height: 72vh;
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18);
        z-index: 21;
      }
      #menu button {
        display: flex;
        gap: 10px;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14.5px;
      }
      #menu button:hover {
        background: var(--soft);
      }
      #menu button.cur {
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 600;
      }
      #menu span {
        color: var(--dim);
        min-width: 24px;
        font-variant-numeric: tabular-nums;
      }
      #help {
        position: fixed;
        right: 20px;
        bottom: 68px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 18px;
        font-size: 14px;
        line-height: 2;
        color: var(--muted);
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18);
        z-index: 22;
      }
      kbd {
        font: 500 12px var(--mono);
        border: 1px solid #cdd3dd;
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--ink);
        background: var(--soft);
      }
      body.fs {
        background: #fff;
      }
      body.fs footer,
      body.fs #notes,
      body.fs #menu,
      body.fs #help {
        display: none !important;
      }
      body.fs #stage {
        box-shadow: none;
      }
      @media (max-width: 700px) {
        .btn .t {
          display: none;
        }
      }

      /* ---------- slide layout ---------- */
      .slide {
        position: absolute;
        inset: 0;
        padding: 40px 68px 66px 80px;
        display: flex;
        flex-direction: column;
      }
      .slide::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 12px;
        background: var(--navy);
      }
      .head {
        flex: none;
      }
      .kicker {
        font: 700 13px/1 var(--sans);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .title {
        font: 600 34px/1.15 var(--serif);
        color: var(--navy);
        margin: 8px 0 0;
        letter-spacing: -0.01em;
      }
      .rule {
        height: 2px;
        background: var(--line);
        margin-top: 12px;
        position: relative;
      }
      .rule::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 2px;
        width: 90px;
        background: var(--accent);
      }
      .body {
        flex: 1;
        min-height: 0;
        margin-top: 20px;
        overflow: hidden;
      }
      .sfoot {
        position: absolute;
        left: 80px;
        right: 68px;
        bottom: 20px;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--dim);
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }

      .two {
        display: grid;
        grid-template-columns: 540px 1fr;
        gap: 36px;
        height: 100%;
        align-items: center;
      }
      .two-shot {
        display: grid;
        grid-template-columns: 650px 1fr;
        gap: 30px;
        height: 100%;
        align-items: start;
      }
      .two-eq {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        height: 100%;
        align-items: start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 13px;
        min-width: 0;
      }
      .row2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }
      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .row4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }

      /* reveal */
      .r {
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      .r.on {
        opacity: 1;
        transform: none;
      }
      svg .r {
        transform: none;
      }
      .instant,
      .instant * {
        transition: none !important;
      }

      /* screenshot browser frame */
      .shot-frame {
        border: 1px solid #cbd3df;
        border-radius: 10px;
        overflow: hidden;
        background: #0a0c0b;
        box-shadow: 0 10px 26px rgba(20, 33, 61, 0.14);
        display: flex;
        flex-direction: column;
      }
      .shot-bar {
        height: 26px;
        background: #171c1a;
        border-bottom: 1px solid #2b3430;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
      }
      .shot-bar i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
        background: #3d4843;
      }
      .shot-bar i:nth-child(1) { background: #ff6b57; }
      .shot-bar i:nth-child(2) { background: #ffb83c; }
      .shot-bar i:nth-child(3) { background: #5ed6a0; }
      .shot-bar span {
        margin-left: 8px;
        font: 500 11px var(--mono);
        color: #9ba79e;
      }
      .shot-frame img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 446px;
        object-fit: contain;
        object-position: top center;
        background: #0a0c0b;
      }

      /* text blocks */
      .lead {
        font-size: 19px;
        line-height: 1.5;
        color: var(--ink);
        margin: 0;
      }
      .small {
        font-size: 14.5px;
        color: var(--muted);
        line-height: 1.48;
        margin: 0;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px 18px;
        background: #fff;
      }
      .card.tint {
        background: var(--soft);
      }
      .card h3 {
        font: 600 19.5px/1.25 var(--serif);
        color: var(--navy);
        margin: 0 0 6px;
      }
      .card p {
        margin: 0;
        font-size: 16px;
        line-height: 1.48;
        color: var(--ink);
      }
      .card .tag {
        display: inline-block;
        font: 700 11.5px var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .callout {
        border-left: 4px solid var(--accent);
        background: var(--accent-soft);
        padding: 12px 16px;
        border-radius: 0 8px 8px 0;
        font-size: 16.5px;
        line-height: 1.45;
      }
      .callout.blue {
        border-color: var(--blue);
        background: var(--blue-soft);
      }
      .callout.green {
        border-color: var(--green);
        background: var(--green-soft);
      }
      .callout.gold {
        border-color: var(--gold);
        background: var(--gold-soft);
      }
      .stat {
        text-align: left;
      }
      .stat .num {
        font: 700 38px/1.05 var(--serif);
        color: var(--navy);
      }
      .stat .lab {
        font-size: 16px;
        line-height: 1.4;
        margin-top: 8px;
      }
      .stat .src {
        font-size: 12.5px;
        color: var(--dim);
        margin-top: 6px;
      }
      .steprow {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        align-items: start;
      }
      .steprow .n {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font: 700 15px var(--sans);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .steprow .n.acc { background: var(--accent); }
      .steprow .n.blu { background: var(--blue); }
      .steprow .n.grn { background: var(--green); }
      .steprow div:last-child {
        font-size: 16.5px;
        line-height: 1.44;
        padding-top: 4px;
      }
      .mono {
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--ink);
      }
      .badge {
        display: inline-block;
        font: 700 12px var(--sans);
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .badge.grey { background: var(--soft); color: var(--muted); }
      .badge.blue { background: var(--blue-soft); color: var(--blue); }
      .badge.green { background: var(--green-soft); color: var(--green); }
      .badge.gold { background: var(--gold-soft); color: var(--gold); }

      /* tables */
      table.mat {
        border-collapse: collapse;
        width: 100%;
        font-size: 14.5px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      table.mat th,
      table.mat td {
        border: 1px solid var(--line);
        padding: 8px 11px;
        text-align: left;
      }
      table.mat th {
        background: var(--soft);
        color: var(--navy);
        font-weight: 700;
      }
      table.mat td.hi {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
      }
      table.mat td.ok {
        background: var(--green-soft);
        color: var(--green);
        font-weight: 700;
      }
      table.mat td.warn {
        background: var(--gold-soft);
        color: #8a560e;
        font-weight: 700;
      }

      /* bars */
      .brow {
        display: grid;
        grid-template-columns: 165px 1fr 52px;
        gap: 10px;
        align-items: center;
        height: 31px;
      }
      .brow .lab {
        font-size: 14.5px;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }
      .brow .track {
        height: 16px;
        background: var(--soft);
        border-radius: 4px;
        overflow: hidden;
      }
      .brow .bar {
        height: 100%;
        width: 0;
        background: var(--navy);
        border-radius: 4px;
        transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .brow .bar.b2 { background: var(--blue); }
      .brow .bar.bg { background: var(--green); }
      .brow .bar.ba { background: var(--accent); }
      .brow .bar.bo { background: var(--gold); }
      .brow .val {
        font: 600 14.5px var(--mono);
        color: var(--navy);
      }

      /* pipeline boxes */
      .pbox {
        border: 1px solid var(--line);
        border-top: 4px solid var(--navy);
        border-radius: 8px;
        padding: 15px 16px;
        background: #fff;
        position: relative;
        height: 100%;
      }
      .pbox.acc { border-top-color: var(--accent); }
      .pbox.blu { border-top-color: var(--blue); }
      .pbox.grn { border-top-color: var(--green); }
      .pbox .k {
        font: 700 12px var(--sans);
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      .pbox h3 {
        font: 600 19px var(--serif);
        color: var(--navy);
        margin: 5px 0 7px;
      }
      .pbox p {
        margin: 0;
        font-size: 15px;
        line-height: 1.44;
      }
      .pbox:not(:last-child)::after {
        content: "→";
        position: absolute;
        right: -14px;
        top: 44%;
        font-size: 19px;
        color: var(--dim);
      }

      /* cover */
      .cover {
        padding: 0;
      }
      .cover .wrap {
        position: absolute;
        left: 92px;
        top: 0;
        bottom: 0;
        width: 615px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .cover .ck {
        font: 700 14px var(--sans);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .cover h1 {
        font: 600 50px/1.08 var(--serif);
        color: var(--navy);
        margin: 16px 0 0;
        letter-spacing: -0.015em;
      }
      .cover .sub {
        font-size: 20.5px;
        line-height: 1.45;
        color: var(--muted);
        margin: 18px 0 0;
      }
      .cover .who {
        margin-top: 34px;
        padding-top: 18px;
        border-top: 2px solid var(--line);
        font-size: 16px;
        line-height: 1.55;
      }
      .cover .who-label {
        font: 700 11px var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 10px;
      }
      .cover .team {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .cover .member {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 1px solid var(--line);
        border-radius: 99px;
        background: var(--soft);
        font: 600 17px var(--serif);
        color: var(--navy);
      }
      .cover .member i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }
      .cover .art {
        position: absolute;
        right: 54px;
        top: 120px;
        width: 470px;
      }
      .cover .sfoot {
        display: none;
      }

      /* compact svg */
      svg.diag {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="viewport"><div id="stage"></div></div>

    <footer>
      <button class="btn" id="bPrev" title="Previous (←)">
        <svg viewBox="0 0 24 24">
          <path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z" /></svg
        ><span class="t">Prev</span>
      </button>
      <button class="btn" id="bNext" title="Next (Space / →)">
        <span class="t">Next</span
        ><svg viewBox="0 0 24 24">
          <path d="M10 6 8.6 7.4l4.6 4.6-4.6 4.6L10 18l6-6z" />
        </svg>
      </button>
      <div id="prog"></div>
      <div id="count"></div>
      <button class="btn" id="bMenu" title="Slides (M)"><span>Slides</span></button>
      <button class="btn" id="bNotes" title="Speaker notes (N)"><span>Notes</span></button>
      <button class="btn" id="bFull" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" /></svg
        ><span class="t">Fullscreen</span>
      </button>
      <button class="btn" id="bHelp" title="Shortcuts (?)">?</button>
    </footer>

    <div id="notes" hidden></div>
    <div id="menu" hidden></div>
    <div id="help" hidden>
      <div><kbd>Space</kbd> <kbd>→</kbd> next &nbsp; <kbd>←</kbd> back</div>
      <div><kbd>F</kbd> fullscreen &nbsp; <kbd>Esc</kbd> exit</div>
      <div><kbd>N</kbd> speaker notes &nbsp; <kbd>M</kbd> slide list</div>
      <div><kbd>Home</kbd> first &nbsp; <kbd>End</kbd> last</div>
    </div>

    <script>
      function bars(el) {
        el.querySelectorAll(".bar[data-w]").forEach((b) => (b.style.width = b.dataset.w + "%"));
      }

      const shot = (src, title, maxH = 446) => `
        <div class="shot-frame">
          <div class="shot-bar"><i></i><i></i><i></i><span>${title}</span></div>
          <img src="${src}" alt="${title}" style="max-height:${maxH}px" />
        </div>`;

      // Reusable 3-Pillar Multimodal SVG diagram
      const PILLARS_SVG = `
        <svg class="diag" viewBox="0 0 540 390" role="img" aria-label="3-pillar multimodal verification flow">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0L10 5L0 10z" fill="#14213d"/>
            </marker>
          </defs>
          <!-- Input Node -->
          <rect x="135" y="10" width="270" height="58" rx="10" fill="#14213d"/>
          <text x="270" y="34" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Source Sans 3, sans-serif">USER INPUT</text>
          <text x="270" y="54" text-anchor="middle" fill="#cbd5e1" font-size="12.5" font-family="JetBrains Mono, monospace">Image (JPG/PNG/WebP) + Claim</text>

          <!-- Arrows down -->
          <path d="M180 68 L85 112" stroke="#14213d" stroke-width="2" fill="none" marker-end="url(#arr)"/>
          <path d="M270 68 L270 112" stroke="#14213d" stroke-width="2" fill="none" marker-end="url(#arr)"/>
          <path d="M360 68 L455 112" stroke="#14213d" stroke-width="2" fill="none" marker-end="url(#arr)"/>

          <!-- Pillar 1 -->
          <g class="r" data-s="0">
            <rect x="8" y="116" width="160" height="126" rx="9" fill="#fbeef0" stroke="#9b1c2c" stroke-width="2"/>
            <text x="88" y="140" text-anchor="middle" fill="#9b1c2c" font-size="11.5" font-weight="700">PILLAR 1</text>

        const v = $("viewport"),
          pad = document.body.classList.contains("fs") ? 0 : 24;
        const s = Math.min((v.clientWidth - pad) / 1280, (v.clientHeight - pad) / 720);
        stage.style.transform = `translate(-50%,-50%) scale(${Math.max(0.1, s)})`;
      }
      addEventListener("resize", fit);

      if (location.search.includes("bare")) document.body.classList.add("fs");
      fit();
      const m = location.hash.match(/^#(\d+)(?:\.(\d+))?/);
      if (m) {
        const si = Math.min(S.length, +m[1]) - 1,
          k = Math.min(S[si].steps.length, +(m[2] || S[si].steps.length)) - 1;
        go(start[si] + k, location.search.includes("still"));
      } else go(0);

      if (location.search.includes("check")) {
        const runCheck = () => {
          const out = [];
          S.forEach((s, si) => {
            go(start[si] + s.steps.length - 1, true);
            const b = el.querySelector(".body");
            if (b.scrollHeight > b.clientHeight + 2 || b.scrollWidth > b.clientWidth + 2)
              out.push(`slide ${si + 1}: body overflow ${b.scrollWidth}x${b.scrollHeight} > ${b.clientWidth}x${b.clientHeight}`);
            const br = b.getBoundingClientRect();
            const items = [
              ...el.querySelectorAll(".card,.callout,.steprow,.lead,.pbox,.small,.brow,.stat,.who,h1,.sub,table.mat,.shot-frame"),
            ].filter((x) => x.offsetParent);
            items.forEach((x) => {
              const r = x.getBoundingClientRect();
              if (r.bottom > br.bottom + 2 || r.right > br.right + 2)
                out.push(`slide ${si + 1}: clipped ${x.className}`);
            });
            for (let i = 0; i < items.length; i++)
              for (let j = i + 1; j < items.length; j++) {
                const a = items[i], c = items[j];
                if (a.contains(c) || c.contains(a)) continue;
                const A = a.getBoundingClientRect(), C = c.getBoundingClientRect();
                const ox = Math.min(A.right, C.right) - Math.max(A.left, C.left),
                  oy = Math.min(A.bottom, C.bottom) - Math.max(A.top, C.top);
                if (ox > 2 && oy > 2) out.push(`slide ${si + 1}: overlap "${a.className}" / "${c.className}"`);
              }
          });
          const pre = document.createElement("pre");
          pre.id = "check";
          pre.textContent = out.length ? out.join("\n") : "LAYOUT OK (" + S.length + " slides)";
          document.body.appendChild(pre);
        };
        window.addEventListener("load", () => setTimeout(runCheck, 300));
      }
    </script>
  </body>
</html>
