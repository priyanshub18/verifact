<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VeriFact: Multimodal Fake Information Detector (20-Slide Presentation)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #14213d;
        --ink: #1f2937;
        --muted: #5b6475;
        --dim: #8a92a3;
        --line: #dfe3ea;
        --soft: #f5f7fa;
        --accent: #9b1c2c;
        --accent-soft: #fbeef0;
        --blue: #1d4e89;
        --blue-soft: #eaf1fa;
        --green: #1e7a4f;
        --green-soft: #e9f6ef;
        --gold: #b7791f;
        --gold-soft: #fbf4e6;
        --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
        --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #e8ebf0;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body { display: flex; flex-direction: column; overflow: hidden; }
      button { font: inherit; color: inherit; }

      /* ---------- chrome ---------- */
      #viewport { flex: 1; position: relative; overflow: hidden; cursor: pointer; }
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1280px;
        height: 720px;
        transform-origin: center;
        background: #fff;
        box-shadow: 0 12px 40px rgba(20, 33, 61, 0.16);
        overflow: hidden;
      }
      footer {
        flex: none;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        background: #fff;
        border-top: 1px solid var(--line);
      }
      .btn {
        height: 34px;
        min-width: 36px;
        padding: 0 12px;
        border: 1px solid #cdd3dd;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: var(--navy);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover { border-color: var(--navy); background: var(--soft); }
      .btn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
      .btn svg { width: 16px; height: 16px; fill: currentColor; }
      #prog { flex: 1; display: flex; gap: 3px; align-items: center; }
      #prog .seg { flex: var(--n); height: 6px; border-radius: 3px; background: #e3e7ee; overflow: hidden; cursor: pointer; }
      #prog .seg i { display: block; height: 100%; width: 0; background: var(--navy); transition: width 0.3s; }
      #count { font-size: 14px; color: var(--muted); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
      #notes {
        position: fixed; left: 20px; bottom: 68px; width: min(580px, calc(100vw - 40px));
        background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent);
        border-radius: 8px; padding: 14px 16px; font-size: 16px; line-height: 1.55; color: var(--ink);
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18); z-index: 20;
      }
      #notes small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
      #menu {
        position: fixed; right: 20px; bottom: 68px; width: min(430px, calc(100vw - 40px)); max-height: 72vh;
        overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px;
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18); z-index: 21;
      }
      #menu button { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
      #menu button:hover { background: var(--soft); }
      #menu button.cur { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
      #menu span { color: var(--dim); min-width: 24px; font-variant-numeric: tabular-nums; }
      #help {
        position: fixed; right: 20px; bottom: 68px; background: #fff; border: 1px solid var(--line);
        border-radius: 8px; padding: 14px 18px; font-size: 14px; line-height: 2; color: var(--muted);
        box-shadow: 0 12px 32px rgba(20, 33, 61, 0.18); z-index: 22;
      }
      kbd { font: 500 12px var(--mono); border: 1px solid #cdd3dd; border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--ink); background: var(--soft); }
      body.fs { background: #fff; }
      body.fs footer, body.fs #notes, body.fs #menu, body.fs #help { display: none !important; }
      body.fs #stage { box-shadow: none; }
      @media (max-width: 700px) { .btn .t { display: none; } }

      /* ---------- slide layout ---------- */
      .slide { position: absolute; inset: 0; padding: 38px 66px 64px 78px; display: flex; flex-direction: column; }
      .slide::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--navy); }
      .head { flex: none; }
      .kicker { font: 700 12.5px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
      .title { font: 600 33px/1.15 var(--serif); color: var(--navy); margin: 8px 0 0; letter-spacing: -0.01em; }
      .rule { height: 2px; background: var(--line); margin-top: 11px; position: relative; }
      .rule::after { content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 90px; background: var(--accent); }
      .body { flex: 1; min-height: 0; margin-top: 18px; overflow: hidden; }
      .sfoot {
        position: absolute; left: 78px; right: 66px; bottom: 18px;
        display: flex; justify-content: space-between; font-size: 13px; color: var(--dim);
        border-top: 1px solid var(--line); padding-top: 8px;
      }

      .two { display: grid; grid-template-columns: 540px 1fr; gap: 34px; height: 100%; align-items: center; }
      .two-shot { display: grid; grid-template-columns: 645px 1fr; gap: 28px; height: 100%; align-items: start; }
      .two-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; height: 100%; align-items: start; }
      .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
      .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

      /* reveal */
      .r { opacity: 0; transform: translateY(10px); transition: opacity 0.45s ease, transform 0.45s ease; }
      .r.on { opacity: 1; transform: none; }
      svg .r { transform: none; }
      .instant, .instant * { transition: none !important; }

      /* screenshot browser frame */
      .shot-frame {
        border: 1px solid #cbd3df; border-radius: 10px; overflow: hidden; background: #0a0c0b;
        box-shadow: 0 10px 26px rgba(20, 33, 61, 0.14); display: flex; flex-direction: column;
      }
      .shot-bar { height: 25px; background: #171c1a; border-bottom: 1px solid #2b3430; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
      .shot-bar i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #3d4843; }
      .shot-bar i:nth-child(1) { background: #ff6b57; }
      .shot-bar i:nth-child(2) { background: #ffb83c; }
      .shot-bar i:nth-child(3) { background: #5ed6a0; }
      .shot-bar span { margin-left: 8px; font: 500 11px var(--mono); color: #9ba79e; }
      .shot-frame img { display: block; width: 100%; height: auto; max-height: 444px; object-fit: contain; object-position: top center; background: #0a0c0b; }

      /* text blocks */
      .lead { font-size: 18.5px; line-height: 1.48; color: var(--ink); margin: 0; }
      .small { font-size: 14.5px; color: var(--muted); line-height: 1.46; margin: 0; }
      .card { border: 1px solid var(--line); border-radius: 10px; padding: 15px 18px; background: #fff; }
      .card.tint { background: var(--soft); }
      .card.hero-box { border: 2px solid var(--navy); background: #f8fafd; padding: 18px 22px; }
      .card h3 { font: 600 19px/1.25 var(--serif); color: var(--navy); margin: 0 0 6px; }
      .card p { margin: 0; font-size: 15.5px; line-height: 1.46; color: var(--ink); }
      .card .tag { display: inline-block; font: 700 11px var(--sans); letter-spacing: 0.11em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
      .callout { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; font-size: 16px; line-height: 1.44; }
      .callout.blue { border-color: var(--blue); background: var(--blue-soft); }
      .callout.green { border-color: var(--green); background: var(--green-soft); }
      .callout.gold { border-color: var(--gold); background: var(--gold-soft); }
      .stat { text-align: left; }
      .stat .num { font: 700 36px/1.05 var(--serif); color: var(--navy); }
      .stat .lab { font-size: 15.5px; line-height: 1.4; margin-top: 7px; }
      .stat .src { font-size: 12px; color: var(--dim); margin-top: 5px; }
      .steprow { display: grid; grid-template-columns: 33px 1fr; gap: 12px; align-items: start; }
      .steprow .n { width: 33px; height: 33px; border-radius: 50%; background: var(--navy); color: #fff; font: 700 14.5px var(--sans); display: flex; align-items: center; justify-content: center; }
      .steprow .n.acc { background: var(--accent); }
      .steprow .n.blu { background: var(--blue); }
      .steprow .n.grn { background: var(--green); }
      .steprow .n.gld { background: var(--gold); }
      .steprow div:last-child { font-size: 16px; line-height: 1.44; padding-top: 3px; }
      .mono { font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--ink); }
      .badge { display: inline-block; font: 700 12px var(--sans); padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
      .badge.grey { background: var(--soft); color: var(--muted); }
      .badge.blue { background: var(--blue-soft); color: var(--blue); }
      .badge.green { background: var(--green-soft); color: var(--green); }
      .badge.gold { background: var(--gold-soft); color: var(--gold); }

      /* tables */
      table.mat { border-collapse: collapse; width: 100%; font-size: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      table.mat th, table.mat td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
      table.mat th { background: var(--soft); color: var(--navy); font-weight: 700; }
      table.mat td.hi { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
      table.mat td.ok { background: var(--green-soft); color: var(--green); font-weight: 700; }
      table.mat td.warn { background: var(--gold-soft); color: #8a560e; font-weight: 700; }

      /* bars */
      .brow { display: grid; grid-template-columns: 165px 1fr 52px; gap: 10px; align-items: center; height: 30px; }
      .brow .lab { font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; }
      .brow .track { height: 15px; background: var(--soft); border-radius: 4px; overflow: hidden; }
      .brow .bar { height: 100%; width: 0; background: var(--navy); border-radius: 4px; transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .brow .bar.b2 { background: var(--blue); }
      .brow .bar.bg { background: var(--green); }
      .brow .bar.ba { background: var(--accent); }
      .brow .bar.bo { background: var(--gold); }
      .brow .val { font: 600 14px var(--mono); color: var(--navy); }

      /* pipeline boxes */
      .pbox { border: 1px solid var(--line); border-top: 4px solid var(--navy); border-radius: 8px; padding: 14px 15px; background: #fff; position: relative; height: 100%; }
      .pbox.acc { border-top-color: var(--accent); }
      .pbox.blu { border-top-color: var(--blue); }
      .pbox.grn { border-top-color: var(--green); }
      .pbox .k { font: 700 11.5px var(--sans); letter-spacing: 0.12em; color: var(--accent); }
      .pbox h3 { font: 600 18.5px var(--serif); color: var(--navy); margin: 5px 0 6px; }
      .pbox p { margin: 0; font-size: 14.5px; line-height: 1.42; }
      .pbox:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 44%; font-size: 18px; color: var(--dim); }

      /* cover */
      .cover { padding: 0; }
      .cover .wrap { position: absolute; left: 92px; top: 0; bottom: 0; width: 615px; display: flex; flex-direction: column; justify-content: center; }
      .cover .ck { font: 700 14px var(--sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
      .cover h1 { font: 600 50px/1.08 var(--serif); color: var(--navy); margin: 16px 0 0; letter-spacing: -0.015em; }
      .cover .sub { font-size: 20px; line-height: 1.45; color: var(--muted); margin: 16px 0 0; }
      .cover .who { margin-top: 32px; padding-top: 18px; border-top: 2px solid var(--line); font-size: 16px; line-height: 1.55; }
      .cover .who-label { font: 700 11px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
      .cover .team { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
      .cover .member { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--soft); font: 600 17px var(--serif); color: var(--navy); }
      .cover .member i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
      .cover .art { position: absolute; right: 54px; top: 120px; width: 470px; }
      .cover .sfoot { display: none; }

      /* SVG flowcharts */
      svg.diag { width: 100%; height: auto; display: block; }
      .fc-box { transition: opacity 0.45s ease; }
    </style>
  </head>
  <body>
    <div id="viewport"><div id="stage"></div></div>

    <footer>
      <button class="btn" id="bPrev" title="Previous (←)">
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z" /></svg
        ><span class="t">Prev</span>
      </button>
      <button class="btn" id="bNext" title="Next (Space / →)">
        <span class="t">Next</span
        ><svg viewBox="0 0 24 24"><path d="M10 6 8.6 7.4l4.6 4.6-4.6 4.6L10 18l6-6z" /></svg>
      </button>
      <div id="prog"></div>
      <div id="count"></div>
      <button class="btn" id="bMenu" title="Slides (M)"><span>Slides</span></button>
      <button class="btn" id="bNotes" title="Speaker notes (N)"><span>Notes</span></button>
      <button class="btn" id="bFull" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" /></svg
        ><span class="t">Fullscreen</span>
      </button>
      <button class="btn" id="bHelp" title="Shortcuts (?)">?</button>
    </footer>

    <div id="notes" hidden></div>
    <div id="menu" hidden></div>
    <div id="help" hidden>
      <div><kbd>Space</kbd> <kbd>→</kbd> next &nbsp; <kbd>←</kbd> back</div>
      <div><kbd>F</kbd> fullscreen &nbsp; <kbd>Esc</kbd> exit</div>
      <div><kbd>N</kbd> speaker notes &nbsp; <kbd>M</kbd> slide list</div>
      <div><kbd>Home</kbd> first &nbsp; <kbd>End</kbd> last</div>
    </div>

    <script>
      function bars(el) {
        el.querySelectorAll(".bar[data-w]").forEach((b) => (b.style.width = b.dataset.w + "%"));
      }

      const shot = (src, title, maxH = 442) => `
        <div class="shot-frame">
          <div class="shot-bar"><i></i><i></i><i></i><span>${title}</span></div>
          <img src="${src}" alt="${title}" style="max-height:${maxH}px" />
        </div>`;

      // ============================================================
      // FLOWCHART 1: Full End-to-End Multimodal Verification Flowchart
      // ============================================================
      const FULL_FLOWCHART_SVG = `
        <svg class="diag" viewBox="0 0 1120 475" role="img" aria-label="End-to-end multimodal verification flowchart">
          <defs>
            <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0L10 5L0 10z" fill="#14213d"/>
            </marker>
            <marker id="fa-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0 0L10 5L0 10z" fill="#9b1c2c"/>
            </marker>
          </defs>

          <!-- STEP 0: INPUT & SAFETY GATE -->
          <g class="r" data-s="0">
            <rect x="10" y="185" width="142" height="92" rx="10" fill="#14213d"/>
            <text x="81" y="212" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="JetBrains Mono, monospace">1. USER INPUT</text>
            <text x="81" y="233" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Image + Claim</text>
            <text x="81" y="252" text-anchor="middle" fill="#cbd5e1" font-size="11.5">(or Image / Text / URL)</text>

            <path d="M152 231 L182 231" stroke="#14213d" stroke-width="2" marker-end="url(#fa)"/>

            <!-- Safety Gate Diamond -->
            <polygon points="244,183 306,231 244,279 182,231" fill="#fbf4e6" stroke="#b7791f" stroke-width="2"/>
            <text x="244" y="226" text-anchor="middle" fill="#14213d" font-size="11.5" font-weight="700">Safe Intake?</text>
            <text x="244" y="242" text-anchor="middle" fill="#7a4e0e" font-size="10">Magic-byte &amp; SSRF</text>

            <!-- Reject path down -->
            <path d="M244 279 L244 335" stroke="#9b1c2c" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#fa-red)"/>
            <text x="252" y="310" fill="#9b1c2c" font-size="10.5" font-weight="700">No</text>
            <rect x="180" y="338" width="128" height="44" rx="7" fill="#fbeef0" stroke="#9b1c2c" stroke-width="1.5"/>
            <text x="244" y="357" text-anchor="middle" fill="#9b1c2c" font-size="11.5" font-weight="700">HTTP 422 Reject</text>
            <text x="244" y="373" text-anchor="middle" fill="#5b6475" font-size="10">Spoof / Private IP</text>
          </g>

          <!-- SPLIT INTO 3 PARALLEL TRACKS -->
          <g class="r" data-s="1">
            <text x="315" y="222" fill="#1e7a4f" font-size="10.5" font-weight="700">Yes</text>
            <path d="M306 231 L342 231 L342 78 L374 78" stroke="#14213d" stroke-width="2" fill="none" marker-end="url(#fa)"/>
            <path d="M306 231 L374 231" stroke="#14213d" stroke-width="2" fill="none" marker-end="url(#fa)"/>
            <path d="M342 231 L342 384 L374 384" stroke="#14213d" stroke-width="2" fill="none" marker-end="url(#fa)"/>

            <!-- TRACK A: IMAGE FORENSICS -->
            <rect x="376" y="18" width="198" height="118" rx="9" fill="#fbeef0" stroke="#9b1c2c" stroke-width="1.8"/>
            <text x="475" y="39" text-anchor="middle" fill="#9b1c2c" font-size="10.5" font-weight="700" font-family="JetBrains Mono, monospace">TRACK A · FORENSICS</text>
            <text x="475" y="59" text-anchor="middle" fill="#14213d" font-size="14" font-weight="700">Pixel &amp; Metadata Lab</text>
            <text x="475" y="79" text-anchor="middle" fill="#374151" font-size="11.5">• EXIF, C2PA &amp; AI/Editor tags</text>
            <text x="475" y="97" text-anchor="middle" fill="#374151" font-size="11.5">• ELA &amp; Median Noise heatmaps</text>
            <text x="475" y="115" text-anchor="middle" fill="#374151" font-size="11.5">• 2D FFT spectral + SHA-256</text>

            <path d="M574 78 L606 78" stroke="#14213d" stroke-width="2" marker-end="url(#fa)"/>

            <rect x="608" y="32" width="184" height="90" rx="9" fill="#fff" stroke="#9b1c2c" stroke-width="1.6"/>
            <text x="700" y="56" text-anchor="middle" fill="#9b1c2c" font-size="11" font-weight="700">IMAGE SCORE</text>
            <text x="700" y="76" text-anchor="middle" fill="#14213d" font-size="13.5" font-weight="700">Authenticity Signals</text>
            <text x="700" y="95" text-anchor="middle" fill="#5b6475" font-size="11">Authentic / Manipulated</text>
            <text x="700" y="111" text-anchor="middle" fill="#5b6475" font-size="11">AI-Generated / Inconclusive</text>
          </g>

          <!-- TRACK B: VISION & PROVENANCE -->
          <g class="r" data-s="2">
            <rect x="376" y="170" width="198" height="122" rx="9" fill="#fbf4e6" stroke="#b7791f" stroke-width="1.8"/>
            <text x="475" y="191" text-anchor="middle" fill="#b7791f" font-size="10.5" font-weight="700" font-family="JetBrains Mono, monospace">TRACK B · VISION LLM</text>
            <text x="475" y="211" text-anchor="middle" fill="#14213d" font-size="14" font-weight="700">Visual &amp; Context Check</text>
            <text x="475" y="231" text-anchor="middle" fill="#374151" font-size="11.5">• Scene, landmarks &amp; OCR text</text>
            <text x="475" y="249" text-anchor="middle" fill="#374151" font-size="11.5">• AI / splicing visual anomalies</text>
            <text x="475" y="267" text-anchor="middle" fill="#374151" font-size="11.5">• Compare image vs. user claim</text>

            <path d="M574 231 L606 231" stroke="#14213d" stroke-width="2" marker-end="url(#fa)"/>

          { note: "Clicking 'Guided Tour' plays a narrated autopilot walkthrough across all screens." },
          { note: "Direct query links also let presenters jump to any dashboard state in one click." },
        ],
      });

      // SLIDE 19: Security, Testing & Honest Limitations
      S.push({
        name: "Security, tests & limitations",
        kicker: "Part 4 · Verification & Engineering Rigor",
        title: "Security hardening, test coverage & honest limitations",
        body: `
          <div class="two-eq">
            <div class="card r" data-s="0">
              <span class="tag">Security &amp; Verification Results</span>
              <h3>Tested Offline &amp; Live</h3>
              <div class="col" style="margin-top:9px;gap:9px">
                <div class="steprow"><div class="n grn">✓</div><div><b>SSRF Protection:</b> Public http(s) IPs only; DNS resolved and every redirect hop re-validated; loopback &amp; private ranges blocked.</div></div>
                <div class="steprow"><div class="n grn">✓</div><div><b>Upload Hardening:</b> Magic-byte sniffing, 15 MB &amp; 40 MP caps, isolated decoding in <code>ml-service</code>.</div></div>
                <div class="steprow"><div class="n grn">✓</div><div><b>41 Automated Tests:</b> <b>34 backend tests</b> + <b>7 ml-service tests</b> + strict Next.js TypeScript &amp; production build passing.</div></div>
                <div class="steprow"><div class="n blu">●</div><div><b>Live E2E Verified:</b> Tested end-to-end against real Groq Vision + Text (<code>qwen/qwen3.8-27b</code>) and live web/Wikipedia retrieval.</div></div>
              </div>
            </div>
            <div class="card tint r" data-s="1">
              <span class="tag">Honest Known Limitations</span>
              <h3>Disclosed on Every Result</h3>
              <div class="col" style="margin-top:9px;gap:9px">
                <p class="small"><b>1. Probabilistic Forensics:</b> Social-media recompression strips EXIF and lowers ELA sensitivity; classical signals are indicators, not proof.</p>
                <p class="small"><b>2. Uncalibrated Confidence:</b> Evidence strength is a transparent heuristic until fitted on held-out benchmarks (ECE / Platt scaling).</p>
                <p class="small"><b>3. Keyless Reverse Search:</b> Without optional Google Vision / SerpAPI keys, provenance uses visual-context web search rather than pixel-exact reverse match.</p>
                <p class="small"><b>4. Modalities Ahead:</b> Video keyframe/deepfake analysis and audio anti-spoofing are planned for the next milestone.</p>
              </div>
            </div>
          </div>`,
        steps: [
          { note: "On the engineering side, VeriFact enforces strict SSRF guards on every redirect hop, magic-byte validation on every upload, 41 automated tests across backend and ml-service, and a verified live Groq end-to-end check." },
          { note: "On the scientific side, VeriFact explicitly discloses its limitations on every result — including uncalibrated confidence, social-media EXIF stripping, and keyless reverse-search trade-offs." },
        ],
      });

      // SLIDE 20: Key Takeaways & Thank You
      S.push({
        name: "Summary & future scope",
        kicker: "Conclusion",
        title: "Key takeaways & future roadmap",
        body: `
          <div class="two" style="grid-template-columns:1fr 375px;align-items:start">
            <div class="col">
              <div class="steprow r" data-s="0"><div class="n">1</div><div><b>Solves Multimodal Misinformation:</b> Independently answers <i>Is the image real?</i>, <i>Does it match the claim?</i>, and <i>Is the claim real?</i></div></div>
              <div class="steprow r" data-s="0"><div class="n acc">2</div><div><b>Combines Forensics + Vision + RAG:</b> Unites EXIF/C2PA/ELA/Noise/FFT heatmaps with Vision OCR alignment and retrieval-first web verification.</div></div>
              <div class="steprow r" data-s="0"><div class="n blu">3</div><div><b>Auditable &amp; Zero Hallucination:</b> Enforces verbatim-quote validation, wire deduplication, NLI cross-checks, and deterministic fusion rules.</div></div>
              <div class="steprow r" data-s="0"><div class="n grn">4</div><div><b>Practical &amp; Free-First:</b> Runs locally with Groq free tier + SQLite fallback, plus a zero-API hardcoded interactive demo at <code>/demo</code>.</div></div>
              <div class="card tint r" data-s="1" style="margin-top:6px;padding:12px 15px">
                <span class="tag">Future Scope</span>
                <p class="small">Held-out LIAR/FEVER calibration (ECE) · Dedicated neural AI-image classifier · Video/audio deepfake &amp; Whisper pipeline · PDF report export &amp; rate limiting.</p>
              </div>
            </div>
            <div class="card tint r" data-s="1" style="text-align:center;padding:34px 22px">
              <div style="font:700 12px var(--mono);letter-spacing:0.16em;color:var(--accent);text-transform:uppercase">VERIFACT · NIT JALANDHAR</div>
              <div style="font:600 38px var(--serif);color:var(--navy);margin-top:8px">Thank you</div>
              <div style="font-size:18px;color:var(--muted);margin-top:6px">Questions &amp; Live Demo</div>
              <div style="margin-top:16px;font:600 15.5px var(--serif);color:var(--navy)">Priyanshu · Suryansh · Tanvi</div>
              <div class="mono" style="margin-top:16px;padding:9px;background:#fff;border:1px solid var(--line);border-radius:7px;font-size:12px">http://localhost:3000<br>http://localhost:3000/demo</div>
            </div>
          </div>`,
        steps: [
          { note: "To wrap up: VeriFact addresses the core gaps in fake information detection by evaluating image authenticity, image-claim alignment, and retrieval-grounded claim truth together — transparently and deterministically." },
          { note: "Thank you everyone! We'd love to demonstrate the live dashboard at localhost:3000/demo and answer any questions." },
        ],
      });

      // ============================================================ player
      const $ = (id) => document.getElementById(id);
      const stage = $("stage");
      const FLAT = [];
      S.forEach((s, si) => s.steps.forEach((_, k) => FLAT.push([si, k])));
      const start = S.map((_, si) => FLAT.findIndex((f) => f[0] === si));
      let pos = -1, rendered = -1, el = null;

      function render(si) {
        const s = S[si];
        stage.innerHTML = `<div class="slide${s.cover ? " cover" : ""}">${
          s.cover ? "" : `<div class="head"><div class="kicker">${s.kicker}</div><h2 class="title">${s.title}</h2><div class="rule"></div></div>`
        }<div class="body">${s.body}</div><div class="sfoot"><span>VeriFact · Multimodal Fake Information Detector</span><span>${si + 1} / ${S.length}</span></div></div>`;
        el = stage.firstElementChild;
        rendered = si;
      }
      function reveal(k) {
        el.querySelectorAll("[data-s]").forEach((x) => x.classList.toggle("on", +x.dataset.s <= k));
      }
      function go(p, still) {
        p = Math.max(0, Math.min(FLAT.length - 1, p));
        const [si, k] = FLAT[p];
        if (!(si === rendered && p === pos + 1)) {
          stage.classList.add("instant");
          render(si);
          reveal(k - 1);
          for (let j = 0; j < k; j++) {
            const f = S[si].steps[j].run;
            f && f(el, true);
          }
          void stage.offsetWidth;
          if (!still) stage.classList.remove("instant");
        }
        reveal(k);
        const f = S[si].steps[k].run;
        f && f(el, !!still);
        pos = p;
        $("count").textContent = `${si + 1} / ${S.length}`;
        $("notes").innerHTML = `<small>Speaker notes · ${si + 1}.${k + 1}</small>${S[si].steps[k].note}`;
        segs.forEach((g, j) => (g.firstChild.style.width = j < si ? "100%" : j > si ? "0%" : ((k + 1) / S[si].steps.length) * 100 + "%"));
        [...$("menu").children].forEach((b, j) => b.classList.toggle("cur", j === si));
      }
      const segs = S.map((s, si) => {
        const g = document.createElement("div");
        g.className = "seg";
        g.innerHTML = "<i></i>";
        g.style.setProperty("--n", s.steps.length);
        g.title = `${si + 1}. ${s.name}`;
        g.onclick = (e) => { e.stopPropagation(); go(start[si]); };
        $("prog").appendChild(g);
        return g;
      });
      S.forEach((s, si) => {
        const b = document.createElement("button");
        b.innerHTML = `<span>${String(si + 1).padStart(2, "0")}</span>${s.name}`;
        b.onclick = () => { go(start[si]); $("menu").hidden = true; };
        $("menu").appendChild(b);
      });

      const next = () => go(pos + 1), prev = () => go(pos - 1);
      function toggleFull() {
        document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
      }
      document.addEventListener("fullscreenchange", () => {
        document.body.classList.toggle("fs", !!document.fullscreenElement);
        $("bFull").classList.toggle("on", !!document.fullscreenElement);
        fit();
      });
      $("bPrev").onclick = prev;
      $("bNext").onclick = next;
      $("bFull").onclick = toggleFull;
      $("bMenu").onclick = () => { $("menu").hidden = !$("menu").hidden; $("help").hidden = true; };
      $("bHelp").onclick = () => { $("help").hidden = !$("help").hidden; $("menu").hidden = true; };
      $("bNotes").onclick = () => { $("notes").hidden = !$("notes").hidden; $("bNotes").classList.toggle("on", !$("notes").hidden); };
      $("viewport").onclick = () => {
        if (!$("menu").hidden || !$("help").hidden) { $("menu").hidden = $("help").hidden = true; return; }
        next();
      };
      document.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const k = e.key;
        if ([" ", "ArrowRight", "ArrowDown", "PageDown", "Enter"].includes(k)) { e.preventDefault(); next(); }
        else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
        else if (k === "Home") go(0);
        else if (k === "End") go(FLAT.length - 1);
        else if (k === "f" || k === "F") toggleFull();
        else if (k === "n" || k === "N") $("bNotes").click();
        else if (k === "m" || k === "M") $("bMenu").click();
        else if (k === "?") $("bHelp").click();
        else if (k === "Escape") { $("menu").hidden = $("help").hidden = true; }
      });
      let tx = null;
      $("viewport").addEventListener("touchstart", (e) => (tx = e.touches[0].clientX), { passive: true });
      $("viewport").addEventListener("touchend", (e) => {
        if (tx == null) return;
        const dx = e.changedTouches[0].clientX - tx;
        tx = null;
        if (Math.abs(dx) > 40) { e.preventDefault(); dx < 0 ? next() : prev(); }
      });

      function fit() {
        const v = $("viewport"), pad = document.body.classList.contains("fs") ? 0 : 24;
        const s = Math.min((v.clientWidth - pad) / 1280, (v.clientHeight - pad) / 720);
        stage.style.transform = `translate(-50%,-50%) scale(${Math.max(0.1, s)})`;
      }
      addEventListener("resize", fit);

      if (location.search.includes("bare")) document.body.classList.add("fs");
      fit();
      const m = location.hash.match(/^#(\d+)(?:\.(\d+))?/);
      if (m) {
        const si = Math.min(S.length, +m[1]) - 1, k = Math.min(S[si].steps.length, +(m[2] || S[si].steps.length)) - 1;
        go(start[si] + k, location.search.includes("still"));
      } else go(0);

      if (location.search.includes("check")) {
        const runCheck = () => {
          const out = [];
          S.forEach((s, si) => {
            go(start[si] + s.steps.length - 1, true);
            const b = el.querySelector(".body");
            if (b.scrollHeight > b.clientHeight + 2 || b.scrollWidth > b.clientWidth + 2)
              out.push(`slide ${si + 1}: body overflow ${b.scrollWidth}x${b.scrollHeight} > ${b.clientWidth}x${b.clientHeight}`);
            const br = b.getBoundingClientRect();
            const items = [
              ...el.querySelectorAll(".card,.callout,.steprow,.lead,.pbox,.small,.brow,.stat,.who,h1,.sub,table.mat,.shot-frame"),
            ].filter((x) => x.offsetParent);
            items.forEach((x) => {
              const r = x.getBoundingClientRect();
              if (r.bottom > br.bottom + 2 || r.right > br.right + 2)
                out.push(`slide ${si + 1}: clipped ${x.className}`);
            });
            for (let i = 0; i < items.length; i++)
              for (let j = i + 1; j < items.length; j++) {
                const a = items[i], c = items[j];
                if (a.contains(c) || c.contains(a)) continue;
                const A = a.getBoundingClientRect(), C = c.getBoundingClientRect();
                const ox = Math.min(A.right, C.right) - Math.max(A.left, C.left),
                  oy = Math.min(A.bottom, C.bottom) - Math.max(A.top, C.top);
                if (ox > 2 && oy > 2) out.push(`slide ${si + 1}: overlap "${a.className}" / "${c.className}"`);
              }
          });
          const pre = document.createElement("pre");
          pre.id = "check";
          pre.textContent = out.length ? out.join("\n") : "LAYOUT OK (" + S.length + " slides)";
          document.body.appendChild(pre);
        };
        window.addEventListener("load", () => setTimeout(runCheck, 300));
      }
    </script>
  </body>
</html>
