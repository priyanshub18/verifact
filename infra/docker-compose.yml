services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: verifact, POSTGRES_PASSWORD: verifact, POSTGRES_DB: verifact}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U verifact"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: verifact, MINIO_ROOT_PASSWORD: verifact-secret}
    volumes: [miniodata:/data]
    profiles: [media]   # used from milestone 2 (image/audio/video)
  ml-service:
    build: ../ml-service
    ports: ["8100:8100"]
    volumes: [hfcache:/home/app/.cache/huggingface]   # model weights download on first use
    profiles: [ml]   # docker compose --profile ml up  (and set ML_SERVICE_URL=http://ml-service:8100)
  api:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://verifact:verifact@postgres:5432/verifact
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8000:8000"]
  worker:
    build: ../backend
    command: arq app.jobs.WorkerSettings
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://verifact:verifact@postgres:5432/verifact
      REDIS_URL: redis://redis:6379/0
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  frontend:
    build: ../frontend
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {pgdata: {}, miniodata: {}, hfcache: {}}
